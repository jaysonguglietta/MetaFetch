name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and Build
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Show Swift toolchain
        run: swift --version

      - name: Run tests
        run: |
          DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer \
          CLANG_MODULE_CACHE_PATH=/tmp/metafetch-clang-cache \
          SWIFTPM_MODULECACHE_OVERRIDE=/tmp/metafetch-swiftpm-cache \
          swift test

      - name: Build app bundle
        run: ./Scripts/build_app.sh

      - name: Verify runtime app bundle
        run: ./Scripts/verify_app_bundle.sh dist/MetaFetch.app

      - name: Check release script syntax
        run: |
          zsh -n Scripts/build_release_dmg.sh
          zsh -n Scripts/publish_release.sh
